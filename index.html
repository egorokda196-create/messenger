 if(step===3)a.innerHTML=`<div class="box"><div class="logo">👤</div><h1>Ваш профиль</h1><p>Введите имя, чтобы завершить регистрацию</p><input id="fn" placeholder="Имя"><input id="ln" placeholder="Фамилия (необязательно)"><div class="err" id="er"></div><button class="btn" id="go" onclick="finish()">Начать общение</button></div>`;
 const f=a.querySelector('input');f&&f.focus();
 a.querySelectorAll('input').forEach(i=>i.onkeydown=e=>{if(e.key==='Enter')a.querySelector('.btn').click()});
}
const busy=(on,t)=>{const b=$('#go');if(!b)return;b.disabled=on;if(t)b.textContent=t};
function sendEmail(){const v=($('#em').value||'').trim().toLowerCase();if(!/^[^\s@'"<>]+@[^\s@'"<>]+\.[^\s@'"<>]{2,}$/.test(v)){errT('Введите корректную почту');return}email=v;sendCode()}
async function sendCode(){
 if(!cfgMail()){errT('Не заданы ключи EmailJS (см. SETUP.md)');return}
 if(typeof emailjs==='undefined'){errT('Не загрузился EmailJS. Проверьте интернет');return}
 if(PEND&&PEND.email===email&&Date.now()-PEND.sent<60000){errT('Повторно можно через '+Math.ceil((60000-(Date.now()-PEND.sent))/1000)+' с');return}
 const code=String(crypto.getRandomValues(new Uint32Array(1))[0]%1000000).padStart(6,'0');
 busy(true,'Отправляем…');
 try{
  await emailjs.send(CFG.emailjs.serviceId,CFG.emailjs.templateId,{to_email:email,email:email,code:code,app_name:'Мессенджер',expires:'10 минут'},{publicKey:CFG.emailjs.publicKey});
  PEND={email,code,exp:Date.now()+6e5,tries:0,sent:Date.now()};
  const was=step;step=2;auth();if(was===2)errT('Код отправлен повторно')
 }catch(e){busy(false,step===1?'Получить код':'Подтвердить');errT('Не удалось отправить письмо: '+((e&&(e.text||e.message))||'ошибка сети'))}
}
async function checkCode(){
 const v=($('#cd').value||'').trim();
 if(!PEND||PEND.email!==email){errT('Сначала запросите код');return}
 if(Date.now()>PEND.exp){PEND=null;errT('Код истёк. Отправьте новый');return}
 if(PEND.tries>=5){PEND=null;errT('Слишком много попыток. Отправьте новый код');return}
 if(v!==PEND.code){PEND.tries++;errT('Неверный код');return}
 PEND=null;await openAccount()
}
async function mkUid(e){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('msgr:'+e));return [...new Uint8Array(b)].slice(0,10).map(x=>x.toString(16).padStart(2,'0')).join('')}catch(_){let h1=5381,h2=52711;for(const ch of e){h1=((h1<<5)+h1+ch.charCodeAt(0))>>>0;h2=((h2<<5)^h2^ch.charCodeAt(0))>>>0}return h1.toString(16).padStart(8,'0')+h2.toString(16).padStart(8,'0')+(e.length%65536).toString(16).padStart(4,'0')}}
function autoUser(){let b=email.split('@')[0].toLowerCase().replace(/[^a-z0-9_]/g,'');if(b.length<3)b=(b+'user').slice(0,12);return b.slice(0,20)}
function initDB(){if(DB||!cfgDb()||typeof firebase==='undefined')return DB;try{if(!firebase.apps.length)firebase.initializeApp(CFG.firebase);DB=firebase.firestore()}catch(e){DB=null}return DB}
function mkChats(n){const now=Date.now();const r=[{id:1,name:'Избранное',type:'saved',msgs:[{m:'Сюда можно сохранять заметки и ссылки',me:0,t:now}]},
 {id:2,name:'Алиса',auto:1,user:'alice',msgs:[{m:'Привет, '+n+'! Добро пожаловать 👋',me:0,t:now}]},
 {id:3,name:'Макс',auto:1,user:'max',msgs:[{m:'Это демо-чат: я отвечаю автоматически. Попробуй отправить мне подарок 🎁',me:0,t:now}]},sysChat()];
 r.push(mkChannel(PRE[0]));r.push(roomChat());return r}
async function openAccount(){
 busy(true,'Входим…');
 UID=await mkUid(email);
 const A=ACCS();
 if(A[email]){U=A[email].U;C=A[email].C;delete A[email];saveAccs(A);U.uid=UID;save();start();return}
 initDB();
 if(DB){
  try{
   const s=await DB.doc('users/'+UID).get();
   if(s.exists){const d=s.data();
    U={email,uid:UID,name:d.n||email.split('@')[0],user:d.user||autoUser(),bio:d.bio||'',ci:d.ci??rn(0,7),stars:100,gifts:[],st:{notif:1,sound:1,read:1,seen:1},seen:[]};
    C=mkChats(U.name);(d.shr||[]).forEach(x=>{if(x&&x.code&&!C.some(c=>c.code===x.code))C.push({id:Date.now()+rn(1,99999),type:'shr',name:String(x.name||x.code).slice(0,40),code:String(x.code),shc:!!x.shc,msgs:[]})});
    save();start();return}
  }catch(e){busy(false,'Подтвердить');errT('Не удалось связаться с базой данных. Проверьте ключи Firebase и правила');return}
 }
 step=3;auth()
}
async function finish(){
 const n=$('#fn').value.trim();if(!n){errT('Введите имя');return}
 busy(true,'Создаём…');
 let base=autoUser(),u=base;
 initDB();
 if(DB){try{for(let k=0;k<5;k++){const q=await DB.collection('users').where('user','==',u).limit(1).get();if(q.empty||q.docs[0].id===UID)break;u=base+rn(10,9999)}}catch(e){}}
 U={email,uid:UID,name:(n+' '+$('#ln').value.trim()).trim(),user:u,bio:'',ci:rn(0,7),stars:100,gifts:[],st:{notif:1,sound:1,read:1,seen:1},seen:[]};
 C=mkChats(n);save();start()
}

function mkChannel(p){const now=Date.now();return{id:Date.now()+rn(1,999),type:'channel',name:p.n,ch:{desc:p.d,subs:p.s,owner:0,slug:p.n.toLowerCase().replace(/\s/g,'_')},msgs:p.p.map((m,i)=>({m,me:0,t:now-(p.p.length-i)*36e5,v:Math.floor(p.s*(.2+Math.random()*.4)),r:{'👍':rn(5,300),'❤️':rn(5,300),'🔥':rn(5,300)}}))}}
function react(i,e){const m=cur&&C.find(c=>c.id===cur).msgs[i];if(!m)return;m.r=m.r||{};if(m.mine===e){m.r[e]--;m.mine=null}else{if(m.mine)m.r[m.mine]--;m.r[e]=(m.r[e]||0)+1;m.mine=e}save();drawChat(1)}

function addChannel(){const n=$('#cn').value.trim(),s=$('#cl').value.trim().toLowerCase();if(!n){$('#er').textContent='Введите название';return}if(s&&!/^[a-z0-9_]{3,}$/.test(s)){$('#er').textContent='Ссылка: латиница, цифры, _ (от 3 символов)';return}
 const c={id:Date.now(),type:'channel',name:n,ch:{desc:$('#cdsc').value.trim(),subs:1,owner:1,slug:s||'channel'+rn(100,999),priv:!!($('#cpv')&&$('#cpv').checked)},msgs:[{m:'Канал «'+n+'» создан. Публикуйте первые посты!',me:0,t:Date.now(),v:1,r:{}}]};C.push(c);save();closeM();openChat(c.id)}
function findCh(){modal(`<b>Каналы</b><div style="display:flex;gap:6px"><input id="jl" placeholder="Ссылка или код"><button class="btn" onclick="joinLink()">OK</button></div>${PRE.map((p,i)=>{const has=C.some(c=>c.ch&&c.name===p.n);return `<div class="row" ${has?'':`onclick="subCh(${i})"`}><div class="av" style="background:${nameCol(p.n)}">${p.n[0]}</div><div class="g1"><b>${p.n}</b><br><small>${p.d} · ${p.s.toLocaleString('ru')} подписчиков${p.price?' · '+p.price+' ⭐':''}</small></div><small>${has?'✓':'Подписаться'}</small></div>`}).join('')}`)}
function subCh(i){const pr=PRE[i].price||0;if(pr){if(U.stars<pr){flash('Нужно '+pr+' ⭐');return}U.stars-=pr;flash('−'+pr+' ⭐ · подписка оформлена')}const c=mkChannel(PRE[i]);if(pr)c.ch.priv=true;C.push(c);save();closeM();openChat(c.id)}

function bm(c,v){
 if(c.st==='name'){c.tmp=v;c.st='user';return say(c,'Отлично. Теперь придумайте username бота — он должен заканчиваться на bot, например my_cool_bot')}
 if(c.st==='user'){const u=v.replace('@','').toLowerCase();if(!/^[a-z0-9_]{2,28}bot$/.test(u))return say(c,'Некорректный username. Латиница, цифры, _ и окончание bot.');
  if(bots().some(x=>x.bot.user===u))return say(c,'Этот username уже занят, попробуйте другой.');
  const tok=rn(1e9,9e9)+':'+Array.from({length:35},()=>'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_-'[rn(0,63)]).join('');
  const b={id:Date.now(),type:'bot',name:c.tmp,bot:{user:u,token:tok,reply:''},msgs:[{m:'Привет! Я '+c.tmp+'. Напишите /start',me:0,t:Date.now()}]};C.push(b);c.st=null;

 const [cmd,...a]=v.split(' '),arg=(a[0]||'').replace('@','').toLowerCase(),b=bots().find(x=>x.bot.user===arg);
 if(cmd==='/newbot'){c.st='name';return say(c,'Как назовём бота? Введите отображаемое имя.')}
 if(cmd==='/mybots')return say(c,bots().length?'Ваши боты:\n'+bots().map(x=>'• '+x.name+' — @'+x.bot.user).join('\n'):'У вас пока нет ботов. Создайте: /newbot');
 if(cmd==='/setreply'){if(!b)return say(c,'Бот не найден. Формат: /setreply @бот текст');b.bot.reply=a.slice(1).join(' ');return say(c,b.bot.reply?'Ответ для @'+arg+' обновлён.':'Ответ сброшен — бот снова эхо.')}
 if(cmd==='/addstep'){if(!b||!a[1])return say(c,'Формат: /addstep @бот вопрос');b.bot.steps=(b.bot.steps||[]).concat(a.slice(1).join(' '));return say(c,'Шагов в сценарии: '+b.bot.steps.length+'. Запуск у бота: /form')}

 if(cmd==='/template'){if(!b||!['weather','remind','notes'].includes(a[1]))return say(c,'Формат: /template @бот weather|remind|notes');b.bot.tpl=(b.bot.tpl||[]).filter(x=>x!==a[1]).concat(a[1]);return say(c,'Шаблон «'+a[1]+'» подключён')}
 if(cmd==='/addrule'){const r=a.slice(1).join(' ').split('=>');if(!b||r.length<2||!r[0].trim())return say(c,'Формат: /addrule @бот слово => ответ');b.bot.rules=b.bot.rules||[];b.bot.rules.push({k:r[0].trim().toLowerCase(),a:r.slice(1).join('=>').trim()});return say(c,'Правило добавлено: «'+r[0].trim()+'» → «'+r[1].trim()+'»')}
 if(cmd==='/rules')return say(c,b?((b.bot.rules||[]).map((x,i)=>(i+1)+'. '+x.k+' → '+x.a).join('\n')||'Правил нет'):'Формат: /rules @бот');
 if(cmd==='/setbuttons'){if(!b)return say(c,'Формат: /setbuttons @бот Кнопка1|Кнопка2');b.bot.btn=a.slice(1).join(' ').split('|').map(x=>x.trim()).filter(Boolean).slice(0,6);return say(c,'Кнопки обновлены: '+(b.bot.btn.join(', ')||'нет'))}
 if(cmd==='/setcmd'){if(!b||!a[1]||!a[2])return say(c,'Формат: /setcmd @бот /команда ответ');b.bot.cmds=b.bot.cmds||{};b.bot.cmds[a[1]]=a.slice(2).join(' ');return say(c,'Команда '+a[1]+' добавлена.')}
 if(cmd==='/token')return say(c,b?'Токен @'+arg+':\n'+b.bot.token:'Бот не найден. Формат: /token @бот');
 if(cmd==='/deletebot'){if(!b)return say(c,'Бот не найден. Формат: /deletebot @бот');C=C.filter(x=>x!==b);return say(c,'Бот @'+arg+' удалён.')}
 say(c,'Не понимаю. Команды: /newbot, /mybots, /setreply, /setbuttons, /setcmd, /addrule, /rules, /addstep, /setprice, /template, /token, /deletebot')}

 if(f===UID){$('#er').textContent='Это вы сами 🙂';return}
 const code='dm'+[UID,f].map(x=>x.replace(/[^a-zA-Z0-9]/g,'').toLowerCase().slice(0,24)).sort().join('x'),ex=C.find(c=>c.code===code);
